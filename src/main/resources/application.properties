app.code=usr
app.name=Users
app.description=User microservice – Manage user data and functionality

## DATABASE
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.default-schema=users

## TENANCY (discriminator column; the tenant column is a String on a UUID column, hence stringtype=unspecified)
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

## FLYWAY
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=users

## DEV (local nexo-platform compose stack; dev-only credentials, never reuse them elsewhere)
%dev.quarkus.devservices.enabled=false
%dev.quarkus.http.port=8082
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:55432/nexo
%dev.quarkus.datasource.username=svc_usr
%dev.quarkus.datasource.password=svc_usr
%dev.quarkus.oidc.auth-server-url=http://localhost:9090/realms/nexo
#
%dev.usr.bootstrap.association-id=a55d0000-0000-4000-8000-000000000001
%dev.usr.bootstrap.name=ASD Nexo Dev
%dev.usr.bootstrap.tax-code=97000000001
%dev.usr.bootstrap.office.street=Via Roma 1
%dev.usr.bootstrap.office.zip-code=00100
%dev.usr.bootstrap.office.city=Roma
%dev.usr.bootstrap.office.province=RM
%dev.usr.bootstrap.office.state=IT
%dev.usr.bootstrap.president-email=president@nexo.test

## TEST (Dev Services: Postgres and Keycloak with the single platform realm)
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.6.2
%test.quarkus.keycloak.devservices.realm-name=nexo
%test.quarkus.keycloak.devservices.realm-path=../nexo-platform/keycloak/nexo-realm.json
#
%test.usr.bootstrap.association-id=a55d0000-0000-4000-8000-00000000000a
%test.usr.bootstrap.name=ASD Nexo Test
